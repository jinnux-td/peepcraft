/** Layers hidden to look under them, by item: a lasso by its path, a zone as "zone:top". Only the view; nothing is saved. */
const hidden = new Set()

const EYE = '<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'
const EYE_OFF = '<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><path d="M3 3l18 18"/></svg>'
/** The layers with the one at `p` a step up (`dir` 1) or down (-1): a lasso past the zones next to it, or past the next lasso if none; a zone

const drawn = (it, role) => role === 'none' && isHead(it.key) ? 'hair' : role
function colour(it, role) {

  if (view === 'test') return test(role)
  return role === 'skin' ? SKIN : role === 'props' || role === 'none' ? '#ffffff' : fb.items[it.key]?.colors?.[role] ?? it.colors[role] ?? test(role)
}

/** Every change: kept for undo, empty entries dropped, saved, drawn again. */
function change(fn) {
  undo.push(JSON.stringify(fb)); if (undo.length > 200) undo.shift()
  fn()
  for (const [k, e] of Object.entries(fb.items)) {
    for (const f of ['areas', 'colors']) if (e[f] && !Object.keys(e[f]).length) delete e[f]
    if (!e.note) delete e.note
    if (e.zonesAt && !Object.keys(e.zonesAt).length) delete e.zonesAt
    if (!Object.keys(e).length) delete fb.items[k]

let timer
function save() {
  clearTimeout(timer)
  timer = setTimeout(async () => {
    const r = await fetch('/feedback', { method: 'PUT', body: JSON.stringify(fb, null, 1) }).catch(() => null)
    $('#status').className = r?.ok ? '' : 'err'
    $('#status').textContent = r?.ok ? `saved ${new Date().toLocaleTimeString()}` : 'NOT saved: is the refine server running?'
  }, 250)
}

/** Takes a piece off an item, or off every item: its areas go back to what the label made them (none, if the label gave them to it), its

function unpiece(role, its) {
  for (const it of its) {
    const e = entry(it.key), refs = [...it.areas.map((_, i) => String(i)), ...it.solids.map((_, i) => 'k' + i)]
    // An area moved to the piece goes back to its label's; one the label gives the piece goes to none.
    for (const ref of refs) if (roleOf(it, ref) === role) { if (labelRole(it, ref) !== role) delete e.areas?.[ref]; else (e.areas ??= {})[ref] = 'none' }
    if (lassos(it).some((l) => l.role === role)) setLayers(it, layers(it).filter((l) => !l.d || l.role !== role))

}
function addType(name) {
  name = name.trim().toLowerCase().replace(/\s+/g, '-')
  const err = !/^[a-z][a-z0-9-]{0,23}$/.test(name) ? 'Use letters, digits and dashes, starting with a letter' : RESERVED.includes(name) ? `"${name}" is taken` : types().includes(name) ? `"${name}" is already a piece` : ''
  if (err) { $('#status').className = 'err'; $('#status').textContent = err; return false }
  change(() => { fb.types = [...types(), name] }); brush = name; renderHeader(); return true
}
function removeType(name) {
  if (name === 'hair') { $('#status').className = 'err'; $('#status').textContent = 'hair stays: a head draws every unlabelled area as hair'; return }
  const n = D.items.filter((it) => usedIn(it).has(name)).length
  if (n && !confirm(`Take "${name}" off ${n} item${n > 1 ? 's' : ''}? Their areas go back to what they were.`)) return
  change(() => { unpiece(name, D.items); fb.types = types().filter((r) => r !== name) })
  if (brush === name) { brush = 'skin'; renderHeader() }
}

function setArea(ref, role) {

  change(() => { const a = (entry().areas ??= {}); if (role === labelRole(it, ref)) delete a[ref]; else a[ref] = role })
}

function renderList() {

}

function renderStage() {
  const it = item(), [x, y, w, h] = it.box
  const lineInk = view === 'item' ? fb.items[it.key]?.colors?.line ?? it.colors.ink ?? '#111111' : '#111111'
  const art = (paper, ink = lineInk) => it.art.replaceAll(D.paper, paper).replaceAll(D.ink, ink)
  const mu = `maskUnits="userSpaceOnUse" x="${x}" y="${y}" width="${w}" height="${h}"`
  // Like build-peeps-skin.ts: each role drawn again in its colour inside a mask; the layers, lowest first, add to their role and take from the
  // rest: a lasso where it covers, a zone where its areas are (an unlabelled area is in no zone and lets what is under it show).
  const paint = (d, on) => `<path d="${d}" fill="${on ? '#fff' : '#000'}"/>`
  // Joined shapes go with the zones: over each run of them, in their area's piece. shortcut: exact unless a zone moved over lassos lies on

  const joinsOf = (role) => joins(it).map((j) => j.d.split(/(?=M)/).map((d) => paint(d, drawn(it, roleOf(it, j.ref)) === role)).join('')).join('')
  const mask = (id, role, list, k) => { const L = shown(it); return `<mask id="${id}" ${mu}>${L.some((l) => l.zone) ? '' : joinsOf(role)}${L.map((l, n) => l.d ? l.d.split(/(?=M)/).map((d) => paint(d, l.role === role)).join('')
    : list.map((a, i) => drawn(it, roleOf(it, k + i)) === l.zone ? paint(a.d, l.zone === role) : '').join('') + (L[n + 1]?.zone ? '' : joinsOf(role))).join('')}</mask>` }

    `<mask id="solids" ${mu}>${it.solids.map((a) => `<path d="${a.d}" fill="#fff"/>`).join('')}</mask>`
  const coloured = art(colour(it, 'none')) + paperRoles.map((r) => `<g mask="url(#p-${r})">${art(colour(it, r))}</g>`).join('') +
    inkRoles.map((r) => `<g mask="url(#solids)"><g mask="url(#i-${r})">${art('#ffffff', colour(it, r))}</g></g>`).join('')
  const changed = fb.items[it.key]?.areas ?? {}
  const hit = (list, k) => list.map((a, i) => `<path class="hit${changed[k + i] ? ' chg' : ''}" data-ref="${k + i}" d="${a.d}${joins(it).filter((j) => j.ref === k + i).map((j) => j.d).join('')}" style="--c:${test(drawn(it, roleOf(it, k + i)))}"/>`).join('')
  const fs = Math.max(w, h) / 30

    it.solids.map((a, i) => `<text class="num k" x="${a.x}" y="${a.y}" font-size="${fs * .8}" stroke-width="${fs / 6}">k${i}</text>`).join('') +
    lassos(it).map((l, i) => { if (hidden.has(layerId(l))) return ''; const n = l.d.match(/-?[\d.]+/g).map(Number); return `<text class="num" x="${n[0]}" y="${n[1]}" font-size="${fs * .8}" stroke-width="${fs / 6}">L${i + 1}</text>` }).join('')

function open(key) {

// ---- events
document.addEventListener('click', (ev) => {
  if (ev.target.id === 'addtype') { const n = prompt('New piece name (tie, sleeves, collar…)'); if (n) addType(n); return }
  if (ev.target.id === 'sub') { sub = !sub; renderHeader(); return }
  if (ev.target.id === 'mergeall') { change(() => setLayers(item(), layers(item()), 'all')); return }
  if (ev.target.id === 'joinall') {
    let got = 0, rest = 0
    change(() => { for (let i = lassos(item()).length - 1; i >= 0; i--) { const [g, r] = joinLasso(item(), i); got += g; rest += r } })
    return say(`joined ${got} shape${got === 1 ? '' : 's'}${rest ? `; ${rest} stay lassos: no area of their piece under or next to them` : ''}`)
  }
  const t = ev.target.closest('[data-tool],[data-brush],[data-key],[data-uncolor],[data-unarea],[data-ldel],[data-lmove],[data-eye],[data-ljoin],[data-unjoin],[data-lsel],[data-set],[data-unpiece],[data-untype]')
  if (!t) { if (!ev.target.closest('#pop,.hit')) hidePop(); return }
  const d = t.dataset
  if (d.unpiece) change(() => unpiece(d.unpiece, [item()]))
  else if (d.untype) removeType(d.untype)
  else if (d.tool) { tool = d.tool; hidePop(); render() }
  else if (d.brush) { brush = d.brush; renderHeader() }
  else if (d.key) open(d.key)
  else if (d.uncolor) change(() => delete entry().colors[d.uncolor])
  else if (d.unarea) change(() => delete entry().areas[d.unarea])
  else if (d.ldel) change(() => { let n = -1; setLayers(item(), layers(item()).filter((l) => !l.d || ++n !== +d.ldel)) })
  else if (d.ljoin) { let r; change(() => { r = joinLasso(item(), +d.ljoin) }); say(r[0] ? `joined ${r[0]} shape${r[0] === 1 ? '' : 's'}${r[1] ? `; ${r[1]} stay a lasso` : ''}` : 'nothing joined: no area of its piece under or next to it') }
  else if (d.unjoin) change(() => unjoin(item(), +d.unjoin))
  else if (d.lsel && !ev.target.closest('select')) { sel = +d.lsel === sel ? null : +d.lsel; renderStage(); renderSide() }
  else if (d.eye) { const id = layerId(layers(item())[+d.eye]); hidden.has(id) ? hidden.delete(id) : hidden.add(id); renderStage(); renderSide() }
  else if (d.lmove) change(() => { const [p, dir] = d.lmove.split(',').map(Number); setLayers(item(), moved(layers(item()), p, dir), auto) })
  else if (d.set) { setArea(d.ref, d.set); hidePop() }
})
$('#side').addEventListener('change', (ev) => {

})

const pop = $('#pop')
function hidePop() { pop.style.display = 'none' }
function showPop(ref, cx, cy) {
  const it = item(), now = roleOf(it, ref), list = ref[0] === 'k' ? [...types(), ...(isHead(it.key) ? [] : ['none'])] : ROLES()
  pop.innerHTML = `<b>${ref[0] === 'k' ? ref : '#' + ref}</b>` + list.map((r) => `<button data-set="${r}" data-ref="${ref}" class="${r === now ? 'cur' : ''}"><span class="chip"><span class="dot" style="background:${test(r)}"></span>${name(r)}</span><kbd>${KEYS[r] ?? ''}</kbd></button>`).join('')

const stage = $('#stage')
const toSvg = (ev) => { const s = stage.querySelector('svg'), p = s.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(s.getScreenCTM().inverse()) }
/** One screen pixel in atom units. */
const px = () => 1 / stage.querySelector('svg').getScreenCTM().a
const liveColour = () => test(brush) === '#ffffff' ? '#888' : test(brush)
/** A new lasso, on top of the item's layers; with auto-merge on, into the one under it when it can. */
function addLasso(list) {
  if (list.length < 3) return
  if (sub) return cutPicked((g, at) => { g.beginPath(); list.forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo'](...at(x, y))); g.fill() })
  const d = 'M' + list.map(([x, y]) => `${Math.round(x)} ${Math.round(y)}`).join('L') + 'Z'
  change(() => setLayers(item(), [...layers(item()), { role: brush, d }], auto))
  sel = lassos(item()).length - 1; render()
}
/** An eraser stroke through the points, `w` atom units wide, rubbed out of the picked layer. */
function eraseStroke(list, w) {
  cutPicked((g, at, u) => {
    g.lineWidth = w / u; g.lineCap = g.lineJoin = 'round'; g.beginPath()
    // A tap is a dot: a stroke needs two points.
    ;[...list, ...(list.length === 1 ? [[list[0][0] + 0.01, list[0][1]]] : [])].forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo'](...at(x, y)))

// The point lasso: the points placed so far, drawn with a line to the pointer.
let pts = null
function drawPts(c) {

  if (!$('#live')) s.insertAdjacentHTML('beforeend', `<polyline id="live" fill="${liveColour()}" fill-opacity=".1" stroke="${liveColour()}" stroke-width="2" vector-effect="non-scaling-stroke"/><circle id="first" r="${6 * px()}" fill="#fff" stroke="${liveColour()}" stroke-width="2" vector-effect="non-scaling-stroke"/>`)
  $('#live').setAttribute('points', [...pts, ...(c ? [[c.x, c.y]] : [])].flat().join(' '))
  $('#first').setAttribute('cx', pts[0][0]); $('#first').setAttribute('cy', pts[0][1])
}
function endPts(close) {
  const list = pts, tol = 2 * px(); pts = null; $('#live')?.remove(); $('#first')?.remove()
  // A double-click places its point twice: points on top of the one before go.
  if (close) addLasso(list.filter((p, i) => !i || Math.hypot(p[0] - list[i - 1][0], p[1] - list[i - 1][1]) > tol))
}
stage.addEventListener('dblclick', () => { if (pts) endPts(true) })
let drawing = null, panning = null
stage.addEventListener('pointerdown', (ev) => {
  const s = stage.querySelector('svg'); if (!s || ev.target.closest('#pop')) return
  if (ev.button === 1 || ev.altKey) { panning = { x: ev.clientX, y: ev.clientY, vb: [...vb] }; s.setPointerCapture(ev.pointerId); return }
  if (tool === 'erase' && ev.button === 0 && !lassos(item())[sel]) return say('Pick a lasso layer first: click its row under Layers', true)
  if ((tool === 'lasso' || tool === 'erase') && ev.button === 0) {
    const p = toSvg(ev); drawing = [[p.x, p.y]]; drawing.w = esize * px(); s.setPointerCapture(ev.pointerId)
    s.insertAdjacentHTML('beforeend', `${tool === 'erase' ? `<polyline id="live" fill="none" stroke="#e00" stroke-opacity=".35" stroke-width="${drawing.w}" stroke-linecap="round" stroke-linejoin="round"/>` : `<polyline id="live" fill="none" stroke="${sub ? '#e00' : liveColour()}" stroke-width="2" ${sub ? 'stroke-dasharray="6 4" ' : ''}vector-effect="non-scaling-stroke"/>`}<line id="rope" stroke="#888" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`)
    return
  }
  if (tool === 'points' && ev.button === 0) {
    const p = toSvg(ev)
    if (pts?.length > 2 && Math.hypot(p.x - pts[0][0], p.y - pts[0][1]) < 8 * px()) return endPts(true)
    ;(pts ??= []).push([p.x, p.y]); drawPts(p)
    return
  }
  const h = ev.target.closest('.hit'); if (!h) return
  if (tool === 'paint') setArea(h.dataset.ref, brush); else showPop(h.dataset.ref, ev.clientX, ev.clientY)
})
stage.addEventListener('pointermove', (ev) => {
  if (panning) { const s = stage.querySelector('svg'), k = vb[2] / s.clientWidth; vb[0] = panning.vb[0] - (ev.clientX - panning.x) * k; vb[1] = panning.vb[1] - (ev.clientY - panning.y) * k; s.setAttribute('viewBox', vb.join(' ')); return }
  if (pts) return drawPts(toSvg(ev))
  if (!drawing) return
  // Stabiliser: the line's end follows the pointer on a string `smooth` screen pixels long, so it only moves when pulled.
  const p = toSvg(ev), [lx, ly] = drawing.at(-1), far = Math.hypot(p.x - lx, p.y - ly), pull = far - smooth * px()
  $('#rope').setAttribute('x1', lx); $('#rope').setAttribute('y1', ly); $('#rope').setAttribute('x2', p.x); $('#rope').setAttribute('y2', p.y)
  if (pull < vb[2] / 300) return
  drawing.push([lx + (p.x - lx) * pull / far, ly + (p.y - ly) * pull / far]); $('#live').setAttribute('points', drawing.flat().join(' '))
})
stage.addEventListener('pointerup', () => {
  panning = null
  if (!drawing) return
  const list = drawing; drawing = null; $('#live')?.remove(); $('#rope')?.remove()
  if (tool === 'erase') eraseStroke(list, list.w); else addLasso(list)
})
stage.addEventListener('wheel', (ev) => {
  ev.preventDefault()
  const s = stage.querySelector('svg'); if (!s) return
  if (ev.ctrlKey || ev.metaKey) {
    const p = toSvg(ev), f = Math.exp(ev.deltaY * .01)
    vb = [p.x - (p.x - vb[0]) * f, p.y - (p.y - vb[1]) * f, vb[2] * f, vb[3] * f]
  } else { const k = vb[2] / s.clientWidth; vb[0] += ev.deltaX * k; vb[1] += ev.deltaY * k }
  s.setAttribute('viewBox', vb.join(' '))
}, { passive: false })

document.addEventListener('keydown', (ev) => {
  if (ev.target.matches('input[type=text],textarea,select')) return
  if ((ev.metaKey || ev.ctrlKey) && ev.key === 'z') { ev.preventDefault(); $('#undo').click(); return }
  if (ev.metaKey || ev.ctrlKey) return
  if (pts && (ev.key === 'Enter' || ev.key === 'Escape')) return endPts(ev.key === 'Enter')
  if (pts && ev.key === 'Backspace') { ev.preventDefault(); pts.pop(); return pts.length ? drawPts() : endPts(false) }
  const role = Object.keys(KEYS).find((r) => KEYS[r] === ev.key)
  if (pop.style.display === 'block' && role && (pop.dataset.ref[0] !== 'k' || types().includes(role) || role === 'none')) { setArea(pop.dataset.ref, role); hidePop(); return }
  if (role) { brush = role; renderHeader() }
  else if (TOOLS.some(([, , k]) => k === ev.key)) { tool = TOOLS.find(([, , k]) => k === ev.key)[0]; hidePop(); render() }
  else if (ev.key === 'Escape') hidePop()
  else if (ev.key === 'x') $('#sub').click()
  else if (ev.key === 'v') $('#view').click()
  else if (ev.key === '0') open(cur)
  else if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    const keys = [...document.querySelectorAll('#list a')].map((a) => a.dataset.key), i = keys.indexOf(cur)
    const next = keys[i + (ev.key === 'ArrowDown' ? 1 : -1)]
    if (next) { ev.preventDefault(); open(next); document.querySelector(`#list a.on`)?.scrollIntoView({ block: 'nearest' }) }
  }
})

Promise.all([fetch('/data').then((r) => r.json()), fetch('/feedback').then((r) => r.json())]).then(([d, f]) => {
  D = d; fb = f
  let last; try { last = localStorage.getItem('peeps-refine:item') } catch {}
  $('#status').textContent = `${D.items.length} items · ${Object.keys(fb.items).length} with feedback`
  open(D.items.some((i) => i.key === last) ? last : D.items[0].key)
})
</script>
</body>
